- Knapp_Apne_Skjema_6:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =ColorFade(Self.Fill, -15%)
      Color: =RGBA(255, 255, 255, 1)
      DisabledBorderColor: =RGBA(166, 166, 166, 1)
      DisplayMode: =If(ThisItem.Status_Grunnskole = 8, DisplayMode.Disabled, DisplayMode.Edit)
      Fill: =
      Font: =Font.'Open Sans'
      FontWeight: =FontWeight.Normal
      Height: =30
      HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
      HoverColor: =RGBA(255, 255, 255, 1)
      HoverFill: =RGBA(0,70,142,100)
      OnSelect: "=\r\n//Legge til skrivetilgang og innsamlingsperiode\r\n\r\n//Hentet fra Årsmelding\r\nSet(vargblGallerySelectedSkole, {});  //force clear\r\n\r\nSet(IsGrunnskole, nfLookupNSR.ErGrunnskole);\r\nSet(IsFrittstaendeSFO, true);\r\nSet(IsOffentligskole, nfLookupNSR.ErOffentligSkole); \r\nSet(IsPrivatSkole, nfLookupNSR.ErPrivatskole); \r\n\r\nSet(vargblSelectedYear, Gallery_Statusside.Selected.Ar);\r\n\r\n//Denne brukes til nfGallerySelectedBarnehageStatus, som igjen brukes til nfDisplayMode. Mulig at denne kan fjernes og man kan refaktorere nfDisplayMode - Hentet fra Årsmelding\r\nSet(vargblGallerySelectedSkole, ThisItem); \r\n\r\n//Set(vargblSelectedYear, If( ThisItem.Ar in [Blank(), 0], vargblYear, ThisItem.Ar));\r\n\r\n//Set(vargblSkjemaStatusId, LookUp(SkjemaStatus, Organisasjonsnummer = Gallery_Statusside.Selected.Organisasjonsnummer && Ar = Gallery_Statusside.Selected.Ar && SkjemaType = \"grunnskole\").SkjemaStatusId); //BOGI-3931\r\nSet(vargblSkjemaStatusId, Value(Gallery_Statusside.Selected.SkjemaStatusId) ); //BOGI-3931\r\n \r\nIf(!(nfLoginRole.RolleId in nfGruppeLeseTilgang) || (nfLoginRole.RolleId = 10 && !IsBlank(Find (\"kommune sentralt\", vargblGallerySelectedSkole.Navn))), \r\n//om rollen ikke er  (myndighet ) så skall den sjekke rolle i altinn(kommunesentralt skall i tilegg gå videre for å få opprettet linsje/status til påbegynt+skrive rettigheter)\r\n\r\n    If(vargblGrunnskoleInnsamlingsperiode = true && \r\n    (\r\n        //Dev rolle leder || kommune sentralt\r\n        \r\n        /* //BOGI-3890\r\n        If(!IsBlank(vargblDevModeSelectedRoleRecord) && vargblEnvironment = \"dev\", 9, // overstyr rolle med vargblDevModeSelectedRoleRecord = skip altinncheck\r\n    \r\n            UIDPConnector2.GetRole({ \r\n            userId: Coalesce( vargblDevModeSelectedRoleRecord.UserId,LookUp(Tilgang, SessionId = GUID(Param(\"sessionId\"))).UserId), \r\n            organizationNumber: Gallery_Statusside.Selected.Organisasjonsnummer, \r\n            requestedForm: \"4\"})\r\n            \r\n        ) in nfGruppeSkriveTilgang */\r\n        \r\n\r\n//ERROR \r\n\r\n\r\nWith(\r\n    {\r\n        varUserId: Coalesce(\r\n            vargblDevModeSelectedRoleRecord.UserId,\r\n            LookUp(Tilgang, SessionId = GUID(Param(\"sessionId\"))).UserId\r\n        )\r\n    },\r\n    If(\r\n        !IsBlank(vargblDevModeSelectedRoleRecord) && vargblEnvironment = \"dev\",\r\n        9 in nfGruppeSkriveTilgang,\r\n        If(\r\n            IsBlank(varUserId),\r\n            false,\r\n            UIDPConnector2.GetRole({\r\n                userId: varUserId,\r\n                organizationNumber: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                requestedForm: \"4\"\r\n            }) in nfGruppeSkriveTilgang\r\n        )\r\n    )\r\n)\r\n\r\n\r\n    ) || (nfLoginRole.RolleId = 10 &&  !IsBlank(Find(\"kommune sentralt\", vargblGallerySelectedSkole.Navn))),\r\n\r\n    //With({SkjemaStatusRow: LookUp(SkjemaStatus, Organisasjonsnummer = Gallery_Statusside.Selected.Organisasjonsnummer && Ar = Gallery_Statusside.Selected.Ar && SkjemaType = \"grunnskole\") }, //BOGI-3931\r\nWith( {SkjemaStatusRow:   If(IsBlank(Gallery_Statusside.Selected.SkjemaStatusId), Blank(), LookUp( SkjemaStatus, SkjemaStatusId = Value(Gallery_Statusside.Selected.SkjemaStatusId) ) ) },\r\n\r\n        //Hvis ingen entry i SkjemaStatus, lag rad\r\n        If( SkjemaStatusRow.Organisasjonsnummer = Blank(),\r\n\r\n            //Hvis Blank, legge inn ny rad i SkjemaStatus\r\n            With(\r\n                {WithStatusId: IfError(\r\n                    Patch(SkjemaStatus, Defaults(SkjemaStatus), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaType: \"grunnskole\",\r\n                        StatusId: 1\r\n                    }).SkjemaStatusId, \r\n                    Notify(\"Error creating SkjemaStatusID Row\", NotificationType.Error)\r\n                )},\r\n\r\n                \r\n                Concurrent(\r\n                    Patch(GsiGrunnskoleSvar, Defaults(GsiGrunnskoleSvar), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaStatusId: WithStatusId,\r\n                        Navn: Gallery_Statusside.Selected.Navn\r\n                    })\r\n                    ,\r\n                    Patch(GsiGrunnskoleSvarDel2, Defaults(GsiGrunnskoleSvarDel2), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaStatusId: WithStatusId\r\n                    }),\r\n                    Patch(GsiGrunnskoleSvarDel3, Defaults(GsiGrunnskoleSvarDel3), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaStatusId: WithStatusId\r\n                    }),\r\n                    Patch(GsiGrunnskoleSvarDel4, Defaults(GsiGrunnskoleSvarDel4), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaStatusId: WithStatusId\r\n                    })\r\n                );\r\n\r\n                // Second Batch of Patches\r\n                Concurrent(\r\n                    Patch(GsiGrunnskoleSvarDel5, Defaults(GsiGrunnskoleSvarDel5), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaStatusId: WithStatusId\r\n                    }),\r\n                    Patch(GsiGrunnskoleSvarDel6, Defaults(GsiGrunnskoleSvarDel6), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaStatusId: WithStatusId,\r\n                        GG_224_Aarsramme_Undervisning_Trinn_1_7: 741,\r\n                        GG_225_Aarsramme_Undervisning_Trinn_8_10: 656\r\n                    }),\r\n                    Patch(GsiGrunnskoleSvarDel7, Defaults(GsiGrunnskoleSvarDel7), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaStatusId: WithStatusId\r\n                    }),\r\n                    Patch(GsiGrunnskoleSvarDel8, Defaults(GsiGrunnskoleSvarDel8), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaStatusId: WithStatusId\r\n                    })\r\n                );\r\n\r\n                // Third Batch of Patches\r\n                Concurrent(\r\n                    Patch(GsiGrunnskoleSvarDel9, Defaults(GsiGrunnskoleSvarDel9), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaStatusId: WithStatusId\r\n                    }),\r\n                    Patch(GsiGrunnskoleSvarDel10, Defaults(GsiGrunnskoleSvarDel10), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaStatusId: WithStatusId\r\n                    }),\r\n                    Patch(GsiGrunnskoleSvarDel11, Defaults(GsiGrunnskoleSvarDel11), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaStatusId: WithStatusId\r\n                    }),\r\n                    Patch(GsiGrunnskoleSvarDel12, Defaults(GsiGrunnskoleSvarDel12), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaStatusId: WithStatusId\r\n                    })\r\n                );\r\n\r\n                // Fourth Batch of Patches\r\n                Concurrent(\r\n                    Patch(GsiGrunnskoleSvarDel13, Defaults(GsiGrunnskoleSvarDel13), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaStatusId: WithStatusId\r\n                    }),\r\n                    Patch(GsiGrunnskoleSvarDel14, Defaults(GsiGrunnskoleSvarDel14), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaStatusId: WithStatusId\r\n                    }),\r\n                    Patch(GsiGrunnskoleSvarDel15, Defaults(GsiGrunnskoleSvarDel15), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaStatusId: WithStatusId\r\n                    }),\r\n                    Patch(GsiGrunnskoleSvarDel16, Defaults(GsiGrunnskoleSvarDel16), {\r\n                        Organisasjonsnummer: Gallery_Statusside.Selected.Organisasjonsnummer,\r\n                        Ar: vargblYear,\r\n                        SkjemaStatusId: WithStatusId\r\n                    })\r\n                );\r\n                   //Patch collection slik at statussiden blir oppdatert. \r\n            Patch(colSPOCTypedTable, LookUp(colSPOCTypedTable, ThisItem.Organisasjonsnummer = Organisasjonsnummer && Ar = ThisItem.Ar), {Status_Grunnskole: 1, SkjemaStatusId: WithStatusId}); //BOGI-3931\r\n            Set(vargblSkjemaStatusId, WithStatusId); // I tilfelle den er tom\r\n            )\r\n                \r\n         \r\n\r\n                //Dersom skjema blir avvist av Eier eller Statsforvalter settes skjema tilbake til Under behandling når Leder åpner skjema \r\n            , SkjemaStatusRow.StatusId in [3, 5, 7], \r\n\r\n            //Setter StatusId tilbake til \"Under behanding\"\r\n            Patch(SkjemaStatus, SkjemaStatusRow, {StatusId: 1});\r\n            \r\n            //Patch collection slik at statussiden blir oppdatert. \r\n            Patch(colSPOCTypedTable, LookUp(colSPOCTypedTable, ThisItem.Organisasjonsnummer = Organisasjonsnummer && Ar = ThisItem.Ar), {Status_Grunnskole:1})\r\n            )// IF sjekk empty statusrow\r\n        ); //End with\r\n\r\n        //Kunne ikke bruke named formulas da den ikke var rask nok til å endre variabel innhold\r\n        //Set(vargblSkjemaStatusId, LookUp(SkjemaStatus, Text(Organisasjonsnummer) = Gallery_Statusside.Selected.Organisasjonsnummer && Ar = Gallery_Statusside.Selected.Ar && SkjemaType = vargblSelectedSkjema).SkjemaStatusId); //BOGI-3931\r\n        Set( vargblSkjemaStatusId, Value(Gallery_Statusside.Selected.SkjemaStatusId));  //BOGI-3931\r\n        //Tester å sette denne i toppen av siden \r\n        Set(vargblGallerySelectedSkole, ThisItem);\r\n\r\n    ) // End if insammlings periode\r\n); //End IF skip if lesetilgang\r\n\r\n//Hentet fra Årsmelding\r\n//If(nfLoginRole.RolleId in nfGruppeSkriveTilgang, Set(vargblSelectedRoleRecord, LookUp(Tilgang , UserId = nfUserId && SessionId= nfSessionId && Organisasjonsnummer = Gallery_Statusside.Selected.Organisasjonsnummer) ));\r\nIf( (nfLoginRole.RolleId in nfGruppeSkriveTilgang) || (nfLoginRole.RolleId = 10 && !IsBlank(Find(\"kommune sentralt\", vargblGallerySelectedSkole.Navn))) , Set(vargblSelectedRoleRecord, LookUp(Tilgang , UserId = nfUserId && SessionId = nfSessionId && Organisasjonsnummer = Gallery_Statusside.Selected.Organisasjonsnummer) ));// Kommune sentralt kode\r\n\r\n\r\n//kjør denne når rollen er 3,4,7,8 så den ikke kjører dobbel\r\n//Set(vargblSkjemaStatusId, LookUp(SkjemaStatus, Text(Organisasjonsnummer) = Gallery_Statusside.Selected.Organisasjonsnummer && Ar = Gallery_Statusside.Selected.Ar && SkjemaType = vargblSelectedSkjema).SkjemaStatusId); //BOGI-3931\r\nSet( vargblSkjemaStatusId, Value(Gallery_Statusside.Selected.SkjemaStatusId));  //BOGI-3931\r\n\r\n//Trace til app insight\r\n/*\r\nTrace(     \"Åpne Grunnskole Action\",      TraceSeverity.Information,      \r\n    {  \r\n        Organisasjonsnummer : Gallery_Statusside.Selected.Organisasjonsnummer, \r\n        Barnehagenavn: Gallery_Statusside.Selected.Navn,\r\n        SessionID: nfSessionId,\r\n        UserID: nfUserId, \r\n        Time: Now() , Username:nfTilgangstabell.UserMail ,\r\n        Lese_skrive: nfDisplayMode     \r\n    } \r\n);\r\n*/\r\n//Hente rolle fra UIDP/Altinn\r\n\r\n//Legge til kommune sentralt? \r\nSet(\r\n  vargblAltinnRolle,\r\n    If( nfLoginRole.RolleId in nfGruppeLeseTilgang, 0, // Skip om det er myndughet, ellers kjør altinn sjekk\r\n        If( !IsBlank(vargblDevModeSelectedRoleRecord) && vargblEnvironment = \"dev\", 9, // overstyr altinn hvis man valgt skole manuelt\r\n                UIDPConnector2.GetRole({ \r\n                userId: Coalesce( vargblDevModeSelectedRoleRecord.UserId,LookUp(Tilgang, SessionId = GUID(Param(\"sessionId\"))).UserId), \r\n                organizationNumber: Gallery_Statusside.Selected.Organisasjonsnummer, \r\n                requestedForm: \"4\" \r\n            })\r\n        )\r\n    )\r\n);\r\n\r\n//Set(Iskommunesentralt, If(nfLoginRole.RolleId = 10 &&  !IsBlank(Find (\"kommune sentralt\" ,vargblGallerySelectedSkole.Navn)) , true, false)); flyttes til innledning\r\n\r\nNavigate(Innledning);\r\n\r\n /*\r\nGetAltinnRoles.Run( \r\n    Coalesce( vargblDevModeSelectedRoleRecord.UserId,LookUp(Tilgang, SessionId = GUID(Param(\"sessionId\"))).UserId), //UserID\r\n    Text(Gallery_Statusside.Selected.Organisasjonsnummer),  // Orgnummer\r\n    \"4\",   //Skjema ID\r\n    BaseUri).rolleid    //Rolle retur fra Altinn\r\n\r\n*/"
      PressedBorderColor: =Self.Fill
      PressedColor: =Self.Fill
      PressedFill: =Self.Color
      RadiusBottomLeft: =3
      RadiusBottomRight: =3
      RadiusTopLeft: =3
      RadiusTopRight: =3
      Size: =Font_Size_Statusside
      TabIndex: =
      Text: '=LookUp(ColTekstDiverse, ID = 13 ).Tekst '
      Visible: |
        =If(ThisItem.Ar = vargblYear , true, false)
      Width: =119
      X: =Knapp_Sakslogg_5.X
      Y: =Knapp_Sakslogg_5.Y
