                                                  // Dette gjøres på grunn av at man trenger one the fly status via formulas, men formulas kan ikke patches med kommentarer
                                                  //BOGI-3524
                                                  // 1) hente oppdataterte Status på kontrollere til temp collection
                                                  ClearCollect(  tempcolKontrollereSkole,   Filter (DropColumns( // Rydder bort unødvendig tekst i json, denne sendes som en del av selected record å bør være så liten som mulig
