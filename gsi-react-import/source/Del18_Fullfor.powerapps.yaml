    JSON(\r\n        {\r\n            Navn: IfError(Office365Users.MyProfile().DisplayName , nfUserId),\r\n            Epost: nfTilgangstabell.UserMail,\r\n            Rolle: MyRole\r\n        }\r\n    )})\r\n)\r\n        \r\n));\r\n\r\nIf(!IsBlank(nfSelectedRecord.OpplysningerGittAv),\r\nUpdateContext({varlclOpplysningerGittAv: nfSelectedRecord.OpplysningerGittAv}))\r\n//Årsmelding = UpdateContext({varlclOpplysningerGittAv: nfSelectedRecord.'BA-10-opplysning_av_navn'}))\r\n"
